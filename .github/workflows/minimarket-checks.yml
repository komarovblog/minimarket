      - name: 0.5.65 all ten live entity counters and dark Atum tiles
        run: php scripts/test-0-5-65-dashboard-counts.php

      - name: MiniMarket 0.5.66 native Atum dashboard regression
        run: php scripts/test-0-5-66-dashboard-native.php

      - name: MiniMarket 0.5.67 stacked full-width responsive dashboard
        run: php scripts/test-0-5-67-dashboard-responsive.php

      - name: MiniMarket 0.5.68 compact tiles and import icon
