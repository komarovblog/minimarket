name: MiniMarket PHP checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push to development needs the full PHP/MySQL suite.
# Cancel queued or running obsolete revisions to avoid wasting Actions time.
concurrency:
  group: minimarket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-category:
    name: MySQL 8 category editor upgrade
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: minimarket_ci_category
          MYSQL_USER: categoryci
          MYSQL_PASSWORD: test_category_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u categoryci -ptest_category_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=18
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
      - name: Check legacy product and category preservation
        env:
          MINIMARKET_CATEGORY_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_category
          MM_CI_DB_USER: categoryci
          MM_CI_DB_PASSWORD: test_category_password
        run: php scripts/test-category-schema.php

  mysql-demo84:
    name: MySQL 8.4 full demo import
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: demo_root_password
          MYSQL_DATABASE: minimarket_ci_demo84
          MYSQL_USER: democi
          MYSQL_PASSWORD: demo_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u democi -pdemo_ci_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=22
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP MySQLi
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli
          coverage: none
      - name: Import complete catalog and assert relationships on MySQL 8.4
        env:
          MINIMARKET_DEMO_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_demo84
          MM_CI_DB_USER: democi
          MM_CI_DB_PASSWORD: demo_ci_password
        run: php scripts/test-demo-sql-mysql84.php
      - name: Feed configuration MySQL 8.4 CRUD and category delta persistence
        env:
          MINIMARKET_DEMO_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_demo84
          MM_CI_DB_USER: democi
          MM_CI_DB_PASSWORD: demo_ci_password
        run: php scripts/test-0-5-61-feeds-db.php
      - name: Full JSON v2 archive round-trip and transactional safety (MySQL 8.4)
        env:
          MINIMARKET_DEMO_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_demo84
          MM_CI_DB_USER: democi
          MM_CI_DB_PASSWORD: demo_ci_password
        run: php scripts/test-catalog-archive-v2-db.php
      - name: 0.5.71 old-grid migration on disposable MySQL 8.4 table
        env:
          MINIMARKET_DEMO_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_demo84
          MM_CI_DB_USER: democi
          MM_CI_DB_PASSWORD: demo_ci_password
        run: php scripts/test-0-5-71-grid-mysql84.php

  mysql-canonical73:
    name: MySQL 8.4 canonical fresh schema and repeatable catalog
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: canonical_root_password
          MYSQL_DATABASE: minimarket_ci_canonical73
          MYSQL_USER: canonci
          MYSQL_PASSWORD: canonical_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u canonci -pcanonical_ci_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=22
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP MySQLi
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli
          coverage: none
      - name: Canonical 0.5.73 fresh database and idempotent demo
        env:
          MINIMARKET_CANONICAL_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_canonical73
          MM_CI_DB_USER: canonci
          MM_CI_DB_PASSWORD: canonical_ci_password
        run: php scripts/test-0-5-73-fresh-mysql84.php
      - name: Canonical 0.5.73 upgrade from populated legacy tables on MySQL 8.4
        env:
          MINIMARKET_CANONICAL_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_canonical73
          MM_CI_DB_USER: canonci
          MM_CI_DB_PASSWORD: canonical_ci_password
        run: php scripts/test-0-5-73-upgrade-mysql84.php
      - name: Manual SQL includes pre-0.5.71 category migration and is repeatable
        env:
          MINIMARKET_CANONICAL_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_canonical73
          MM_CI_DB_USER: canonci
          MM_CI_DB_PASSWORD: canonical_ci_password
        run: php scripts/test-0-5-73-manual-grid-mysql84.php

      - name: Execute actual 0.5.73 clean SQL on disposable MySQL 8.4 database
        env:
          MINIMARKET_CANONICAL_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_canonical73
          MM_CI_DB_USER: canonci
          MM_CI_DB_PASSWORD: canonical_ci_password
        run: |
          pwsh -NoProfile -File ./scripts/build-clean-catalog.ps1 -DbPrefix nnop3_ -DatabaseName minimarket_ci_canonical73 -OutputPath ./clean-ci-73.sql
          php scripts/test-0-5-73-clean-mysql84.php ./clean-ci-73.sql
          php scripts/test-0-5-75-stock-mysql84.php
          php scripts/test-0-5-77-mysql84.php
          php scripts/test-0-5-78-orders-mysql84.php
          php scripts/test-0-5-81-orders-mysql84.php
          php scripts/test-0-5-82-schema-mysql84.php
          php scripts/test-0-5-83-schema-mysql84.php
          php scripts/test-0-5-84-schema-mysql84.php

  windows-package:
    name: Windows component ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MiniMarket component ZIP
        shell: powershell
        run: |
          & .\scripts\build.ps1
      - name: Inspect MiniMarket component ZIP
        shell: powershell
        run: |
          & .\scripts\inspect-package.ps1
      - name: Verify one-command Desktop delivery has exactly 3 files
        shell: powershell
        run: |
          $dest = Join-Path (Get-Location) 'dist\desktop-ci'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          & .\scripts\release-to-desktop.ps1 -SkipPull -DesktopPath $dest
          if ($LASTEXITCODE -ne 0) { throw 'MM75_DESKTOP_RELEASE_FAILED' }
          $actual = @(Get-ChildItem -LiteralPath $dest -File | Select-Object -ExpandProperty Name | Sort-Object)
          [xml]$manifest = Get-Content -LiteralPath '.\src\com_minimarket\minimarket.xml' -Raw -Encoding UTF8
          $version = [string]$manifest.extension.version
          $expected = @("com_minimarket-$version.zip", "minimarket_mysql84_nnop3_update_$($version.Replace('.', '_')).sql", "mod_minimarket_toolbar-$version.zip") | Sort-Object
          if (($actual -join '|') -ne ($expected -join '|')) {
            throw ("MM75_DESKTOP_RELEASE_EXPECTED_THREE: " + ($actual -join ','))
          }
          Write-Output 'MM75_DESKTOP_THREE_FILES_WINDOWS_PASS'
      - name: Verify clean catalog SQL generator on Windows PowerShell
        shell: powershell
        run: |
          & .\scripts\build-clean-catalog.ps1 -DbPrefix nnop3_ -DatabaseName minimarket -OutputPath .\dist\minimarket_clean_ci_0.5.73.sql
          if (-not (Test-Path .\dist\minimarket_clean_ci_0.5.73.sql)) { throw 'CLEAN_SQL_GENERATOR_FAILED' }
          $sql = Get-Content .\dist\minimarket_clean_ci_0.5.73.sql -Raw -Encoding UTF8
          if ($sql -notmatch 'SET SESSION group_concat_max_len = 65535;' -or
              $sql -match 'group_concat_max_len\s*=\s*GREATEST' -or
              $sql -notmatch 'DROP TABLE IF EXISTS' -or
              $sql -notmatch 'CREATE TABLE IF NOT EXISTS' -or
              $sql -notmatch 'nnop3_minimarket_attribute_values' -or
              $sql -notmatch "s.version_id = '0.5.73'" -or
              $sql -match '#__minimarket_' -or
              $sql -match 'DROP TABLE.*nnop3_users') {
            throw 'CLEAN_SQL_CONTENT_INVALID'
          }
          Write-Output 'CLEAN_SQL_GENERATOR_WINDOWS_OK'
      - name: Verify optional color demo uses ten existing media references
        shell: powershell
        run: |
          $sql = Get-Content .\sample-data\minimarket_demo_color_switch_0_5_73.sql -Raw -Encoding UTF8
          $launcher = Get-Content .\scripts\release-demo-color-to-desktop.ps1 -Raw -Encoding UTF8
          if ($sql -match 'images/minimarket/demo-(tee|mug)-' -or
              $launcher -match 'create-demo-images.ps1') { throw 'COLOR_DEMO_STILL_GENERATES_IMAGES' }
          foreach ($i in 1..10) {
            $name = 'images/minimarket/sample-{0:D2}.png' -f $i
            if (-not $sql.Contains($name)) { throw "COLOR_DEMO_MISSING_EXISTING_MEDIA_REFERENCE: $name" }
          }
          Write-Output 'COLOR_DEMO_REUSES_10_EXISTING_IMAGES_OK'
      - name: Validate Joomla DB-check repair script on Windows
        shell: powershell
        run: |
          $token = $null
          $errors = $null
          $path = Join-Path (Get-Location) 'scripts\repair-joomla-dbcheck-073.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$token, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw "MM73_REPAIR_POWERSHELL_SYNTAX_FAILED: $($errors[0])" }
          $contents = Get-Content $path -Raw -Encoding UTF8
          if ($contents -notmatch 'verify-installed-canonical-073.php' -or
              $contents -notmatch 'Get-FileHash' -or
              $contents -notmatch 'MM73_NO_DATABASE_CHANGES') {
            throw 'MM73_REPAIR_GUARDS_MISSING'
          }
          Write-Output 'MM73_JOOMLA_SQL_HISTORY_REPAIR_WINDOWS_SYNTAX_PASS'
      - name: Get component version for release archive
        id: component_version
        shell: powershell
        run: |
          [xml]$manifest = Get-Content .\src\com_minimarket\minimarket.xml -Raw -Encoding UTF8
          "value=$($manifest.extension.version)" >> $env:GITHUB_OUTPUT
      - name: Upload component ZIP and separate demo SQL
        uses: actions/upload-artifact@v4
        with:
          name: com_minimarket-${{ steps.component_version.outputs.value }}
          path: |
            dist/com_minimarket-${{ steps.component_version.outputs.value }}.zip
            dist/minimarket_toys_rich_import.sql
            dist/minimarket_brands_collections_demo.sql
            dist/minimarket_mysql84_nnop3_full_demo.sql
            dist/minimarket_bundles_demo_0_5_51.sql
            dist/minimarket_bundle_prices_demo_0_5_52.sql
            dist/minimarket_product_badges_demo_0_5_53.sql
            dist/minimarket_ui_benefit_demo_0_5_54.sql
            dist/minimarket_digital_demo_0_5_55.sql
            dist/minimarket_mysql84_nnop3_update_0_5_73.sql
            dist/mod_minimarket_toolbar-${{ steps.component_version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 14

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip, dom, mbstring, simplexml

      - name: Lint extension and regression scripts
        shell: bash
        run: |
          set -euo pipefail
          find src/com_minimarket scripts -type f -name '*.php' -print0 \
            | xargs -0 -n 1 php -l > /dev/null
          echo "PHP_LINT_OK"

      - name: MiniMarket cart 0.5.74 state, bundles and UI contract
        run: php scripts/test-0-5-74-cart.php

      - name: MiniMarket checkout order request and administrator views
        run: |
          php scripts/test-0-5-78-checkout.php
          php scripts/test-0-5-79-auth.php
          php scripts/test-0-5-80-checkout-phase.php
          php scripts/test-0-5-81-checkout.php
          php scripts/test-0-5-82-ui.php
          php scripts/test-0-5-83-features.php
          php scripts/test-0-5-84-features.php
          php scripts/test-0-5-97.php
          php scripts/test-0-5-98.php
          php scripts/test-0-5-99.php
          node --check src/com_minimarket/media/js/gallery.js
          node --check src/com_minimarket/media/js/product-page.js
          node --check src/com_minimarket/media/js/faceted-catalog.js
          node --check src/com_minimarket/media/js/admin-display-groups.js
          node --check src/com_minimarket/media/js/category-card-gallery.js
          node --check src/com_minimarket/media/js/promo-video-editor.js
          test ! -f src/com_minimarket/media/js/admin-columns.js  # Native Joomla table.columns replaces retired custom JS
          php -l src/com_minimarket/admin/src/Controller/DeliveryController.php
          php -l src/com_minimarket/admin/src/Controller/PromocodeController.php
          php -l src/com_minimarket/admin/src/View/Delivery/HtmlView.php
          node --check src/com_minimarket/media/js/manual-order.js
          node --check src/com_minimarket/media/js/inherited-options.js
          node --check src/com_minimarket/media/js/category-actions.js
          node --check src/com_minimarket/media/js/category-list-visibility.js
          node --check src/com_minimarket/media/js/checkout.js
          node --check src/com_minimarket/media/js/seo-category-editor.js
          php -l src/com_minimarket/site/src/Service/CheckoutData.php
          php -l src/com_minimarket/site/src/Service/OrderStorage.php
          php -l src/com_minimarket/site/src/Controller/CheckoutController.php
          php -l src/com_minimarket/admin/src/Controller/OrderController.php

      - name: MiniMarket 0.5.77 one product value, multi-select facet and bundle UI
        run: |
          php scripts/test-0-5-77-single-value.php
          node --check src/com_minimarket/media/js/entity-picker.js
          node --check src/com_minimarket/media/js/attribute-settings.js

      - name: MiniMarket catalog AJAX sort and global page size
        run: |
          php scripts/test-0-5-76-catalog-live.php
          node --check src/com_minimarket/media/js/catalog-live.js
          node scripts/test-0-5-76-catalog-live.js

      - name: MiniMarket 0.5.76 filter settings and persistence
        run: php scripts/test-0-5-76-filter-settings.php

      - name: MiniMarket badge checkbox and percent/ruble interactions
        run: node scripts/test-0-5-76-badges-ui.js

      - name: MiniMarket 0.5.75 stock-aware filters, sorting and cart
        run: |
          php scripts/test-0-5-75-storefront.php
          node --check src/com_minimarket/media/js/faceted-catalog.js
          node --check src/com_minimarket/media/js/cart.js
          node scripts/test-0-5-75-cart-js.js

      - name: Sitemap feed XML and public Joomla article regression
        run: php scripts/test-sitemap-feed.php

      - name: MiniMarket 0.5.95 method settings and category SEO regression
        run: php scripts/test-0-5-95-methods-seo.php

      - name: Router regression tests
        run: php scripts/test-router.php

      - name: Catalog regression tests
        run: php scripts/test-catalog.php

      - name: Category parent and visibility regression tests
        run: php scripts/test-category-tree.php

      - name: Administrator category hierarchy and counts
