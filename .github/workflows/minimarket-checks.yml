name: MiniMarket PHP checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-category:
    name: MySQL 8 category editor upgrade
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: minimarket_ci_category
          MYSQL_USER: categoryci
          MYSQL_PASSWORD: test_category_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u categoryci -ptest_category_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=18
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
      - name: Check legacy product and category preservation
        env:
          MINIMARKET_CATEGORY_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_category
          MM_CI_DB_USER: categoryci
          MM_CI_DB_PASSWORD: test_category_password
        run: php scripts/test-category-schema.php

  windows-package:
    name: Windows component ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MiniMarket component ZIP
        shell: powershell
        run: |
          & .\scripts\build.ps1
      - name: Inspect MiniMarket component ZIP
        shell: powershell
        run: |
          & .\scripts\inspect-package.ps1

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint extension and regression scripts
        shell: bash
        run: |
          set -euo pipefail
          find src/com_minimarket scripts -type f -name '*.php' -print0 \
            | xargs -0 -n 1 php -l > /dev/null
          echo "PHP_LINT_OK"

      - name: Router regression tests
        run: php scripts/test-router.php

      - name: Catalog regression tests
        run: php scripts/test-catalog.php

      - name: Category parent and visibility regression tests
        run: php scripts/test-category-tree.php

      - name: Administrator category hierarchy and counts
        run: php scripts/test-admin-category-tree.php

      - name: Shop menu selector regression tests
        run: php scripts/test-shopmenu.php

      - name: Admin settings visibility regression tests
        run: php scripts/test-admin-options.php
