name: MiniMarket PHP checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-category:
    name: MySQL 8 category editor upgrade
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: minimarket_ci_category
          MYSQL_USER: categoryci
          MYSQL_PASSWORD: test_category_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u categoryci -ptest_category_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=18
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
      - name: Check legacy product and category preservation
        env:
          MINIMARKET_CATEGORY_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_category
          MM_CI_DB_USER: categoryci
          MM_CI_DB_PASSWORD: test_category_password
        run: php scripts/test-category-schema.php

  mysql-demo84:
    name: MySQL 8.4 full demo import
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: demo_root_password
          MYSQL_DATABASE: minimarket_ci_demo84
          MYSQL_USER: democi
          MYSQL_PASSWORD: demo_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u democi -pdemo_ci_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=22
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP MySQLi
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli
          coverage: none
      - name: Import complete catalog and assert relationships on MySQL 8.4
        env:
          MINIMARKET_DEMO_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_demo84
          MM_CI_DB_USER: democi
          MM_CI_DB_PASSWORD: demo_ci_password
        run: php scripts/test-demo-sql-mysql84.php
      - name: Feed configuration MySQL 8.4 CRUD and category delta persistence
        env:
          MINIMARKET_DEMO_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_demo84
          MM_CI_DB_USER: democi
          MM_CI_DB_PASSWORD: demo_ci_password
        run: php scripts/test-0-5-61-feeds-db.php
      - name: Full JSON v2 archive round-trip and transactional safety (MySQL 8.4)
        env:
          MINIMARKET_DEMO_CI: '1'
          MM_CI_DB_HOST: 127.0.0.1
          MM_CI_DB_PORT: '3306'
          MM_CI_DB_DATABASE: minimarket_ci_demo84
          MM_CI_DB_USER: democi
          MM_CI_DB_PASSWORD: demo_ci_password
        run: php scripts/test-catalog-archive-v2-db.php

  windows-package:
    name: Windows component ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MiniMarket component ZIP
        shell: powershell
        run: |
          & .\scripts\build.ps1
      - name: Inspect MiniMarket component ZIP
        shell: powershell
        run: |
          & .\scripts\inspect-package.ps1
      - name: Get component version for release archive
        id: component_version
        shell: powershell
        run: |
          [xml]$manifest = Get-Content .\src\com_minimarket\minimarket.xml -Raw -Encoding UTF8
          "value=$($manifest.extension.version)" >> $env:GITHUB_OUTPUT
      - name: Upload component ZIP and separate demo SQL
        uses: actions/upload-artifact@v4
        with:
          name: com_minimarket-${{ steps.component_version.outputs.value }}
          path: |
            dist/com_minimarket-${{ steps.component_version.outputs.value }}.zip
            dist/minimarket_toys_rich_import.sql
            dist/minimarket_brands_collections_demo.sql
            dist/minimarket_mysql84_nnop3_full_demo.sql
            dist/minimarket_bundles_demo_0_5_51.sql
            dist/minimarket_bundle_prices_demo_0_5_52.sql
            dist/minimarket_product_badges_demo_0_5_53.sql
            dist/minimarket_ui_benefit_demo_0_5_54.sql
            dist/minimarket_digital_demo_0_5_55.sql
            dist/minimarket_mysql84_nnop3_update_0_5_65.sql
            dist/mod_minimarket_toolbar-${{ steps.component_version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 14

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip, dom, mbstring, simplexml

      - name: Lint extension and regression scripts
        shell: bash
        run: |
          set -euo pipefail
          find src/com_minimarket scripts -type f -name '*.php' -print0 \
            | xargs -0 -n 1 php -l > /dev/null
          echo "PHP_LINT_OK"

      - name: Router regression tests
        run: php scripts/test-router.php

      - name: Catalog regression tests
        run: php scripts/test-catalog.php

      - name: Category parent and visibility regression tests
        run: php scripts/test-category-tree.php

      - name: Administrator category hierarchy and counts
        run: php scripts/test-admin-category-tree.php

      - name: Joomla administrator entity links resolve to edit controllers
        run: php scripts/test-admin-entity-links.php

      - name: Native Joomla UI consistency across categories and variants
        run: php scripts/test-native-ui-consistency.php

      - name: Attribute list query and schema regression
        run: php scripts/test-attribute-list-query.php

      - name: Product editor and clean media validation
        run: php scripts/test-product-editor.php

      - name: Options, stock modes and independent linked products
        run: php scripts/test-option-architecture.php

      - name: Native admin menus, AJAX pickers and bundle pricing UI
        run: php scripts/test-0-5-52-ui.php

      - name: 0.5.55 type-specific product forms, bundle search and import/export
        run: php scripts/test-0-5-55-ui.php
      - name: 0.5.56 global shop and rich import
        run: php scripts/test-0-5-56-store-import.php
      - name: 0.5.57 cumulative catalog SQL static contract
        run: php scripts/test-cumulative-sql.php
      - name: 0.5.58 category settings and descendants
        run: php scripts/test-0-5-58-category-options.php
      - name: 0.5.58 bundle editor columns and calculated totals
        run: php scripts/test-0-5-58-bundle-ui.php
      - name: 0.5.58 bundle picker syntax
        run: node --check src/com_minimarket/media/js/entity-picker.js
      - name: 0.5.59 safety of promo and badge JS
        run: |
          node --check src/com_minimarket/media/js/promo-video.js
          node --check src/com_minimarket/media/js/product-badges.js
      - name: 0.5.59 component consistency audit
        run: php scripts/test-0-5-59-audit.php
      - name: 0.5.60 promo interactions in simulated DOM
        run: node scripts/test-promo-video-interactions.js
      - name: Local Joomla Playwright E2E syntax (browser requires installed Joomla)
        run: node --check scripts/e2e/storefront.mjs
      - name: 0.5.60 component review coverage
        run: php scripts/test-0-5-60-wiring.php
      - name: 0.5.61 feed selection, XML and native dashboard
        run: php scripts/test-0-5-61-feeds.php
      - name: 0.5.64 standalone toolbar and retired legacy extension safety
        run: |
          php scripts/test-0-5-64-toolbar.php
          php scripts/test-0-5-64-installer.php
          php scripts/test-0-5-64-retired-module.php
      - name: 0.5.64 full-width control bands and quarter-width tiles
        run: php scripts/test-0-5-64-dashboard.php
      - name: 0.5.61 feed checkbox and category DOM
        run: |
          node scripts/test-0-5-61-feeds-editor.js
          node --check src/com_minimarket/media/js/feed-editor.js
      - name: Audit each administrator task route and registered media asset
        run: php scripts/audit-component-wiring.php

      - name: 0.5.54 kit visibility, brands, benefits, unified editors and import layout
        run: php scripts/test-0-5-54-ui.php

      - name: Product badge rounding, expiry, schema and bilingual storefront
        run: php scripts/test-product-badges.php

      - name: Bundles, SKU components, nested stock and Joomla form
        run: php scripts/test-bundles.php

      - name: Brands, collections, product relationships and admin SEO
        run: php scripts/test-brands-collections.php

      - name: Global order-option dictionary, category inheritance and checkbox regression
        run: php scripts/test-order-options.php

      - name: Expandable relationship editor, paged product finder and Joomla schema compatibility
        run: php scripts/test-group-editor.php

      - name: Stable global option IDs and automatic category options in products
        run: php scripts/test-global-option-links.php

      - name: Excel XLSX and CSV catalog exchange regression
        run: php scripts/test-catalog-tabular-v1.php

      - name: Catalog import v1 strict package and security checks
        run: php scripts/test-catalog-import.php

      - name: Typed category-scoped product attributes
        run: php scripts/test-product-attributes.php

      - name: Unified attributes and multiple numeric values
        run: php scripts/test-unified-attributes.php

      - name: Real variant SKU combinations and per-variant photo validation
        run: php scripts/test-product-variants.php

      - name: SKU-v3 full position media and content overrides
        run: php scripts/test-sku-v3-media.php

      - name: New product-local SKU matrix planner
        run: php scripts/test-variant-matrix.php
      - name: Direct SKU matrix, one price and per-SKU gallery assignments
        run: |
          php scripts/test-sku-matrix-gallery.php
          php scripts/test-sku-position-editor.php

      - name: Public variant SKU, image and stock reads
        run: php scripts/test-public-variants.php

      - name: Published product attributes on storefront
        run: php scripts/test-public-product-attributes.php
      - name: Attribute input and filter mode JS syntax
        run: node --check src/com_minimarket/media/js/attribute-settings.js

      - name: Product attributes category UI JavaScript syntax
        run: node --check src/com_minimarket/media/js/product-attributes.js

      - name: Native variant rows and storefront variant switching JavaScript
        run: |
          node --check src/com_minimarket/media/js/sku-matrix.js
          node --check src/com_minimarket/media/js/group-editor.js
          node --check src/com_minimarket/media/js/option-value-color.js
          node --check src/com_minimarket/media/js/variants.js

      - name: Dependent color size and multi-option SKU availability
        run: node scripts/test-storefront-option-dependencies.js

      - name: Relational product gallery and Joomla Subform regression
        run: php scripts/test-product-gallery.php

      - name: Attribute/value dictionaries and validation
        run: php scripts/test-attributes.php
      - name: Seven attribute data types and independent product/filter controls
        run: php scripts/test-attribute-presentation.php

      - name: Attribute values repeatable Joomla subform and data safety
        run: php scripts/test-attribute-value-rows.php
      - name: Native Joomla numeric preset repeatable input
        run: php scripts/test-numeric-preset-rows.php

      - name: Four new attribute types and typed text choices
        run: php scripts/test-attribute-four-types.php
      - name: Product videos, color swatches and document media safety
        run: php scripts/test-media-0514.php

      - name: Native Joomla admin SearchTools and publish indicators
        run: php scripts/test-native-admin-lists.php

      - name: Bulk admin actions and reverse category relation
        run: php scripts/test-admin-bulk.php

      - name: Category attribute inheritance and update regression
        run: php scripts/test-category-attributes.php

      - name: Product gallery JavaScript syntax
        run: node --check src/com_minimarket/media/js/gallery.js

      - name: Clean Media JavaScript syntax
        run: node --check src/com_minimarket/media/js/clean-media.js

      - name: Nested variant gallery Media metadata cleanup
        run: node scripts/test-clean-variant-media.js

      - name: Shop menu selector regression tests
        run: php scripts/test-shopmenu.php

      - name: Admin settings visibility regression tests
        run: php scripts/test-admin-options.php
